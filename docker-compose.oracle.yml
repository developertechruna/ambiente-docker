version: '3.8'

services:
  oracle19c:
    image: cristianorosa/oracle19c:latest
    container_name: oracle19c
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=REDACTED_ORACLE_PASSWORD
      - ORACLE_SID=ORCLCDB
      - ORACLE_PDB=ORCLPDB1
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
    # Memoria compartida tmpfs de 2GB indispensable para el motor de Oracle
    shm_size: 2gb

volumes:
  oracle_data:
    driver: local
