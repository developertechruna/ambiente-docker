# ==============================================================================
# Traefik TLSStore: Certificado por Defecto para HTTPS en todo el Clúster
# Nota: El Secret 'cluster-default-tls' se genera automáticamente desde los archivos
# de certificados locales usando 'make deploy-tls' o 'scripts/deploy-secrets.sh'
# ==============================================================================

apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: cluster-default-tls
