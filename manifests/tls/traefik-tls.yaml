# ==============================================================================
# Configuración SSL/TLS Global para Traefik y Aplicaciones en K3s
# Certificado Autofirmado con SAN para IP 192.168.18.228 y dominios locales
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cluster-default-tls
  namespace: kube-system
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: REDACTED_TLS_KEY---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-default-tls
  namespace: viniplay
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: REDACTED_TLS_KEY---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-default-tls
  namespace: tasks-app
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: REDACTED_TLS_KEY---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-default-tls
  namespace: demo-apps
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: REDACTED_TLS_KEY---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: cluster-default-tls
