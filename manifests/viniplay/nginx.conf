server {
    listen 80;
    server_name _;
    absolute_redirect off;

    client_max_body_size 500M;

    # Redirigir /viniplay sin barra final a /viniplay/
    location = /viniplay {
        return 301 /viniplay/;
    }

    # Manejador del subpath /viniplay/
    location /viniplay/ {
        proxy_pass http://viniplay:8998/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /viniplay;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Fallback de compatibilidad directa para proxy de imágenes (/api/image-proxy)
    location /api/image-proxy {
        proxy_pass http://viniplay:8998/api/image-proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
    }

    # Fallback directo para streaming transcodificado (/stream)
    location /stream {
        proxy_pass http://viniplay:8998/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
