server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Redirigir /viniplay sin barra final a /viniplay/
    location = /viniplay {
        return 301 /viniplay/;
    }

    # Fallback de compatibilidad directa para proxy de imágenes de VOD / EPG
    location /api/image-proxy {
        proxy_pass http://viniplay:8998/api/image-proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Fallback directo para streaming transcodificado (/stream)
    location /stream {
        proxy_pass http://viniplay:8998/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Manejador del subpath /viniplay/
    location /viniplay/ {
        proxy_pass http://viniplay:8998/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /viniplay;

        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        sub_filter_types text/html text/javascript application/javascript application/x-javascript application/json;
        sub_filter_once off;

        sub_filter 'src="/' 'src="/viniplay/';
        sub_filter 'href="/viniplay.png"' 'href="/viniplay/viniplay.png"';
        sub_filter 'href="/manifest.json"' 'href="/viniplay/manifest.json"';
        sub_filter '"/js/' '"/viniplay/js/';
        sub_filter '"/api/' '"/viniplay/api/';
        sub_filter '"/dvr/' '"/viniplay/dvr/';
        sub_filter '"/stream' '"/viniplay/stream';
        sub_filter '"/sw.js"' '"/viniplay/sw.js"';
        sub_filter "'/api/" "'/viniplay/api/";
        sub_filter "'/dvr" "'/viniplay/dvr";
        sub_filter "'/stream" "'/viniplay/stream";
        sub_filter '`/stream' '`/viniplay/stream';
        sub_filter "'/js/" "'/viniplay/js/";
        sub_filter "'/sw.js'" "'/viniplay/sw.js'";

        sub_filter '<head>' '<head><script>(function(){const P="/viniplay";const oF=window.fetch;window.fetch=function(i,n){if(typeof i==="string"&&(i.startsWith("/api/")||i.startsWith("/dvr/")||i.startsWith("/stream")||i.startsWith("/sw.js"))){i=P+i}else if(i instanceof Request){const u=new URL(i.url);if(u.pathname.startsWith("/api/")||u.pathname.startsWith("/dvr/")||u.pathname.startsWith("/stream")){i=new Request(P+u.pathname+u.search,i)}}return oF.call(this,i,n)};if(navigator.sendBeacon){const oB=navigator.sendBeacon;navigator.sendBeacon=function(u,d){if(typeof u==="string"&&(u.startsWith("/api/")||u.startsWith("/dvr/")||u.startsWith("/stream"))){u=P+u}return oB.call(this,u,d)}}const oO=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u,...r){if(typeof u==="string"&&(u.startsWith("/api/")||u.startsWith("/dvr/")||u.startsWith("/stream"))){u=P+u}return oO.call(this,m,u,...r)};const sD=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,"src");if(sD&&sD.set){const oS=sD.set;Object.defineProperty(HTMLMediaElement.prototype,"src",{set:function(v){if(typeof v==="string"&&(v.startsWith("/stream")||v.startsWith("/dvr/")||v.startsWith("/api/"))){v=P+v}return oS.call(this,v)},get:sD.get})};const imgD=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,"src");if(imgD&&imgD.set){const oIS=imgD.set;Object.defineProperty(HTMLImageElement.prototype,"src",{set:function(v){if(typeof v==="string"&&(v.startsWith("/api/")||v.startsWith("/dvr/")||v.startsWith("/stream"))){v=P+v}return oIS.call(this,v)},get:imgD.get})};const oPush=history.pushState;history.pushState=function(s,t,u){if(typeof u==="string"){try{const parsed=new URL(u,window.location.origin);if(!parsed.pathname.startsWith(P)){parsed.pathname=P+(parsed.pathname==="/"?"":parsed.pathname);u=parsed.pathname+parsed.search+parsed.hash}}catch(e){}}return oPush.call(this,s,t,u)};const oRepl=history.replaceState;history.replaceState=function(s,t,u){if(typeof u==="string"){try{const parsed=new URL(u,window.location.origin);if(!parsed.pathname.startsWith(P)){parsed.pathname=P+(parsed.pathname==="/"?"":parsed.pathname);u=parsed.pathname+parsed.search+parsed.hash}}catch(e){}}return oRepl.call(this,s,t,u)}})();</script>';
    }
}
