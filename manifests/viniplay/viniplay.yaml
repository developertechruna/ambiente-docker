# ==============================================================================
# Despliegue de ViniPlay (IPTV Streaming Web Player & TV Guide & DVR)
# en Kubernetes (K3s) con enrutamiento por Subpath (/viniplay)
# Repositorio oficial: https://github.com/ardoviniandrea/ViniPlay
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: viniplay
---
# 1. Secret para la clave de sesión y variables sensibles
apiVersion: v1
kind: Secret
metadata:
  name: viniplay-secret
  namespace: viniplay
type: Opaque
stringData:
  SESSION_SECRET: "REDACTED_VINI_SESSION_SECRET"
---
# 2. ConfigMap con la configuración de Proxy Inverso Nginx para Subpath (/viniplay)
apiVersion: v1
kind: ConfigMap
metadata:
  name: viniplay-nginx-conf
  namespace: viniplay
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        client_max_body_size 500M;

        # Redirigir /viniplay sin barra final a /viniplay/
        location = /viniplay {
            return 301 /viniplay/;
        }

        # Manejador del subpath /viniplay/
        location /viniplay/ {
            proxy_pass http://127.0.0.1:8998/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /viniplay;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Fallback de compatibilidad directa para proxy de imágenes (/api/image-proxy)
        location /api/image-proxy {
            proxy_pass http://127.0.0.1:8998/api/image-proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
        }

        # Fallback directo para streaming transcodificado (/stream)
        location /stream {
            proxy_pass http://127.0.0.1:8998/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
---
# 3. Volumen Persistente (PVC) para Datos y Configuración (/data)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: viniplay-data-pvc
  namespace: viniplay
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
# 4. Volumen Persistente (PVC) para Grabaciones DVR (/dvr)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: viniplay-dvr-pvc
  namespace: viniplay
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# 5. Despliegue de ViniPlay (Deployment con Sidecar Nginx y Adaptador de Rutas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viniplay
  namespace: viniplay
  labels:
    app: viniplay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: viniplay
  template:
    metadata:
      labels:
        app: viniplay
    spec:
      containers:
      # Contenedor 1: Backend Node.js + FFMPEG ViniPlay
      - name: viniplay
        image: localhost/viniplay:custom
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8998
          name: nodejs
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "8998"
        - name: BASE_PATH
          value: "/viniplay"
        envFrom:
        - secretRef:
            name: viniplay-secret
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        volumeMounts:
        - name: viniplay-data
          mountPath: /data
        - name: viniplay-dvr
          mountPath: /dvr
        startupProbe:
          tcpSocket:
            port: 8998
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          tcpSocket:
            port: 8998
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8998
          initialDelaySeconds: 15
          periodSeconds: 15

      # Contenedor 2: Sidecar Nginx para traducción de subpath (/viniplay)
      - name: nginx-proxy
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        readinessProbe:
          httpGet:
            path: /viniplay/
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /viniplay/
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10

      volumes:
      - name: viniplay-data
        persistentVolumeClaim:
          claimName: viniplay-data-pvc
      - name: viniplay-dvr
        persistentVolumeClaim:
          claimName: viniplay-dvr-pvc
      - name: nginx-conf
        configMap:
          name: viniplay-nginx-conf
---
# 6. Servicio de Red Interno (ClusterIP en puerto 80)
apiVersion: v1
kind: Service
metadata:
  name: viniplay-svc
  namespace: viniplay
  labels:
    app: viniplay
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: viniplay
---
# 7. Ingress Traefik para enrutamiento por Subpath: /viniplay y proxy de imágenes
# Responde en: http://<IP_SERVIDOR>/viniplay y http://<IP_SERVIDOR>/api/image-proxy
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viniplay-ingress
  namespace: viniplay
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
  - secretName: cluster-default-tls
  rules:
  - http:
      paths:
      - path: /viniplay
        pathType: Prefix
        backend:
          service:
            name: viniplay-svc
            port:
              number: 80
      - path: /api/image-proxy
        pathType: Prefix
        backend:
          service:
            name: viniplay-svc
            port:
              number: 80
      - path: /stream
        pathType: Prefix
        backend:
          service:
            name: viniplay-svc
            port:
              number: 80
