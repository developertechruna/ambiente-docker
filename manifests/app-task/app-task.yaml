apiVersion: v1
kind: Namespace
metadata:
  name: tasks-app

---

# ==============================================================================
# Microservicio Backend: Spring Boot 3 / Java 17
# Conexión directa a PostgreSQL en namespace 'databases'
# Base Path: /tasks
# ==============================================================================

# 1. Credenciales de Base de Datos
apiVersion: v1
kind: Secret
metadata:
  name: app-backend-secret
  namespace: tasks-app
type: Opaque
stringData:
  DB_USER: app_task
  DB_PASSWORD: "REDACTED_POSTGRES_PASSWORD"
---
# 2. Configuración del Microservicio Backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-backend-config
  namespace: tasks-app
data:
  SERVER_PORT: "8089"
  SERVER_CONTEXT_PATH: "/tasks"
  # DNS interno de Kubernetes hacia el servicio de PostgreSQL en namespace databases
  DB_HOST: "postgres-svc.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "app_task"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  LOG_LEVEL: "INFO"
---
# 3. Despliegue del Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: tasks-app
  labels:
    app: app-backend
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
        tier: api
    spec:
      containers:
      - name: backend
        image: app-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8089
          name: http
        envFrom:
        - configMapRef:
            name: app-backend-config
        - secretRef:
            name: app-backend-secret
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "768Mi"
        livenessProbe:
          httpGet:
            path: /tasks/actuator/health/liveness
            port: 8089
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /tasks/actuator/health/readiness
            port: 8089
          initialDelaySeconds: 25
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
---
# 4. Servicio ClusterIP del Backend
apiVersion: v1
kind: Service
metadata:
  name: app-backend-svc
  namespace: tasks-app
  labels:
    app: app-backend
    tier: api
spec:
  type: ClusterIP
  ports:
  - port: 8089
    targetPort: 8089
    name: http
  selector:
    app: app-backend

---

# ==============================================================================
# Aplicativo Frontend: Angular 18 + Nginx
# Despliegue independiente en Kubernetes
# Base Path: /tasks
# ==============================================================================

# 1. Despliegue del Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-frontend
  namespace: tasks-app
  labels:
    app: app-frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-frontend
  template:
    metadata:
      labels:
        app: app-frontend
        tier: web
    spec:
      containers:
      - name: frontend
        image: app-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
# 2. Servicio ClusterIP del Frontend
apiVersion: v1
kind: Service
metadata:
  name: app-frontend-svc
  namespace: tasks-app
  labels:
    app: app-frontend
    tier: web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: app-frontend
---
# 3. Servicio NodePort del Frontend (Acceso directo opcional: http://192.168.18.228:30090/tasks/)
apiVersion: v1
kind: Service
metadata:
  name: app-frontend-nodeport
  namespace: tasks-app
  labels:
    app: app-frontend
    tier: web
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
    name: http
  selector:
    app: app-frontend

---

# ==============================================================================
# Ingress Traefik (K3s) para Enrutamiento por Path
# Base Path: /tasks
# Frontend UI: http://192.168.18.228/tasks/
# Backend API: http://192.168.18.228/tasks/api/
# Actuator:    http://192.168.18.228/tasks/actuator/health
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: tasks-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
  - secretName: cluster-default-tls
  rules:
  - http:
      paths:
      # Peticiones al API REST van al backend (prefijo /tasks/api)
      - path: /tasks/api
        pathType: Prefix
        backend:
          service:
            name: app-backend-svc
            port:
              number: 8089
      # Métricas y Actuator van al backend (prefijo /tasks/actuator)
      - path: /tasks/actuator
        pathType: Prefix
        backend:
          service:
            name: app-backend-svc
            port:
              number: 8089
      # Tráfico del aplicativo Web Frontend (prefijo /tasks)
      - path: /tasks
        pathType: Prefix
        backend:
          service:
            name: app-frontend-svc
            port:
              number: 80
