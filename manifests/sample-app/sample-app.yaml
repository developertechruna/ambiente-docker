apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: demo-apps
  labels:
    app: web-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
# Exposición 1: Servicio ClusterIP para comunicación interna
apiVersion: v1
kind: Service
metadata:
  name: web-demo-svc
  namespace: demo-apps
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: web-demo
---
# Exposición 2: Ingress Traefik (integrado en K3s)
# Sin host fijo: responde en cualquier IP o dominio en el path /demo
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-demo-ingress
  namespace: demo-apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /demo
        pathType: Prefix
        backend:
          service:
            name: web-demo-svc
            port:
              number: 80
---
# Exposición 3: NodePort directo para pruebas en cualquier IP de nodo
apiVersion: v1
kind: Service
metadata:
  name: web-demo-nodeport
  namespace: demo-apps
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
  selector:
    app: web-demo
